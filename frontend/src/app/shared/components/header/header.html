<header class="app-header">
  <div class="header-container">
    <!-- Columna 1: Logo -->
    <div class="header-logo" (click)="navegarHome()">
      <img src="logo.png" alt="Logo Empresa" class="logo-img" />
    </div>

    <!-- Columna 2: Mensaje de Bienvenida -->
    <div class="header-welcome">
      <span class="welcome-text">
        {{ isAuthenticated && nombreUsuario ? 'Bienvenido, ' + nombreUsuario : 'Bienvenido' }}
      </span>
    </div>

    <!-- Columna 3: Botón Login/Logout -->
    <div class="header-actions">
      <button
        *ngIf="!isAuthenticated"
        pButton
        label="Iniciar Sesión"
        icon="pi pi-sign-in"
        class="p-button-rounded p-button-primary"
        (click)="navegarLogin()"
      ></button>

      <button
        *ngIf="isAuthenticated"
        pButton
        label="Cerrar Sesión"
        icon="pi pi-sign-out"
        class="p-button-rounded p-button-danger"
        (click)="cerrarSesion()"
      ></button>
    </div>
  </div>
</header>
