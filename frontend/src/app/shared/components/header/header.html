<header class="app-header">
  <div class="header-container">
    <!-- Columna 1: Logo -->
    <div class="header-logo" (click)="navegarHome()">
      <img src="logo.png" alt="Logo Empresa" class="logo-img" />
    </div>

    <!-- Columna 2: Navegación / Mensaje de Bienvenida -->
    <div class="header-welcome d-flex flex-column align-items-center">
      <!-- Si está autenticado mostramos nav compacto para cliente/admin -->
      <nav *ngIf="isAuthenticated" class="mb-1 w-100">
        <ul class="d-flex gap-3 list-unstyled mb-0 justify-content-center align-items-center">
          <!-- Enlaces visibles para cliente -->
          <li *ngIf="esCliente()">
            <a class="text-white text-decoration-none" (click)="navegarProductos()">Productos</a>
          </li>
          <li *ngIf="esCliente()">
            <a class="text-white text-decoration-none" (click)="navegarCarrito()">Carrito</a>
          </li>
          <li *ngIf="esCliente()">
            <a class="text-white text-decoration-none" (click)="navegarOrdenes()">Mis órdenes</a>
          </li>

          <!-- Enlaces visibles para admin (si quieres otros enlaces admin, déjalos aquí) -->
          <li *ngIf="esAdmin()">
            <a class="text-white text-decoration-none" routerLink="/admin">Panel Admin</a>
          </li>
        </ul>
      </nav>

      <!-- Mensaje de Bienvenida -->
      <div class="w-100 text-center">
        <span class="welcome-text">
          {{ isAuthenticated && nombreUsuario ? 'Bienvenido, ' + nombreUsuario : 'Bienvenido a Technology Fix' }}
        </span>
      </div>
    </div>

    <!-- Columna 3: Botón Login/Logout -->
    <div class="header-actions d-flex justify-content-end align-items-center">
      <button
        *ngIf="!isAuthenticated"
        pButton
        label="Iniciar Sesión"
        icon="pi pi-sign-in"
        class="p-button-rounded p-button-primary"
        (click)="navegarLogin()"
      ></button>

      <div *ngIf="isAuthenticated" class="d-flex gap-2 align-items-center">
  
        <button
          pButton
          label="Cerrar Sesión"
          icon="pi pi-sign-out"
          class="p-button-rounded p-button-danger"
          (click)="cerrarSesion()"
        ></button>
      </div>
    </div>
  </div>
</header>
