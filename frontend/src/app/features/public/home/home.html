<div class="container py-5">
  <h2 class="text-center mb-5">Nuestros Productos</h2>

  <!-- Spinner de carga -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando productos...</span>
    </div>
  </div>

  <!-- Grid de productos -->
  <div class="row g-4" *ngIf="!cargando">
    <div 
      class="col-12 col-sm-6 col-md-4 col-lg-3" 
      *ngFor="let producto of productos"
    >
      <div class="card h-100 shadow-sm product-card">
        
        <!-- ⭐ Imagen corregida con URL completa -->
        <img 
          *ngIf="producto.imagenNombre"
          [src]="productoService.obtenerUrlImagen(producto.imagenNombre)"
          [alt]="producto.nombre"
          class="card-img-top"
          (error)="onImageError($event)"
          loading="lazy"
        >
        
        <!-- Placeholder si no hay imagen -->
        <div 
          *ngIf="!producto.imagenNombre" 
          class="card-img-top bg-secondary d-flex align-items-center justify-content-center"
          style="height: 200px;"
        >
          <i class="bi bi-image text-white" style="font-size: 3rem;"></i>
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ producto.nombre }}</h5>

          <p class="card-text descripcion">
            {{ producto.descripcion }}
          </p>

          <p class="precio">
            S/ {{ producto.precio | number:'1.2-2' }}
          </p>

          <!-- Badge de disponibilidad -->
          <span 
            class="badge mb-2" 
            [ngClass]="producto.disponibilidad === 'Disponible' ? 'bg-success' : 'bg-danger'"
          >
            {{ producto.disponibilidad }}
          </span>

          <button 
            class="btn btn-primary mt-auto"
            (click)="irAlLogin()"
            [disabled]="producto.disponibilidad === 'Agotado'"
          >
            {{ producto.disponibilidad === 'Disponible' ? 'Comprar' : 'Agotado' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay productos -->
  <div *ngIf="!cargando && productos.length === 0" class="text-center py-5">
    <i class="bi bi-inbox" style="font-size: 4rem; color: #ccc;"></i>
    <p class="text-muted mt-3">No hay productos disponibles en este momento</p>
  </div>
</div>
