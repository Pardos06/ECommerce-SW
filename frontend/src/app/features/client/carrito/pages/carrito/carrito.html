<app-header></app-header>

<div class="carrito-container container py-5">

  <h2 class="mb-5 fw-bold d-flex justify-content-center align-items-center gap-2">
    <i class="bi bi-cart3"></i>
    Carrito de Compras
  </h2>

  <div *ngIf="items.length === 0" class="alert alert-info text-center py-4 fs-5">
    <i class="bi bi-bag-x fs-3 d-block mb-2"></i>
    Tu carrito está vacío.
  </div>

  <div *ngIf="items.length > 0" class="table-responsive">
    <table class="table table-hover align-middle carrito-table shadow-sm">
      <thead class="table-dark">
        <tr>
          <th><i class="bi bi-box-seam"></i> Producto</th>
          <th><i class="bi bi-cash-coin"></i> Precio</th>
          <th class="text-center"><i class="bi bi-plus-slash-minus"></i> Cantidad</th>
          <th class="text-end"><i class="bi bi-calculator"></i> Total</th>
          <th></th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of items">

          <td class="fw-semibold">{{ item.nombre }}</td>

          <td class="text-primary fw-bold">
            S/ {{ item.precio | number:'1.2-2' }}
          </td>

          <td class="text-center">
            <input
              type="number"
              min="1"
              class="form-control cantidad-input"
              [(ngModel)]="item.cantidad"
              (change)="actualizar(item)"
            />
          </td>

          <td class="text-end fw-semibold text-success">
            S/ {{ (item.precio * item.cantidad) | number:'1.2-2' }}
          </td>

          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1"
                    (click)="eliminar(item.idProducto)">
              <i class="bi bi-trash"></i>
              Quitar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="items.length > 0" class="mt-4">
    <label class="form-label fw-semibold">
      <i class="bi bi-credit-card-2-front"></i> Método de pago
    </label>

    <select class="form-select shadow-sm"
            [(ngModel)]="selectedMetodoPago">
      <option value="0">Seleccione...</option>
      <option *ngFor="let m of metodosPago" [value]="m.id">
        {{ m.nombre }}
      </option>
    </select>
  </div>

  <div *ngIf="items.length > 0"
       class="carrito-total mt-4 d-flex justify-content-between align-items-center">

    <h3 class="fw-bold text-success">
      <i class="bi bi-cash-stack"></i>
      Total: S/ {{ total | number:'1.2-2' }}
    </h3>

    <button class="btn btn-success btn-lg d-flex align-items-center gap-2 shadow"
            (click)="procesarPago()">
      <i class="bi bi-shield-check"></i>
      Proceder al Pago
    </button>
  </div>
</div>

<app-footer></app-footer>
