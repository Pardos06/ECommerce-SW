<app-header></app-header>

<div class="productos-container container py-5">

  <h2 class="text-center mb-5 fw-bold d-flex justify-content-center align-items-center gap-2">
    <i class="bi bi-grid"></i>
    Nuestros Productos
  </h2>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
  </div>

  <div class="row g-4" *ngIf="!cargando && productos.length > 0">

    <div class="col-12 col-sm-6 col-md-4 col-lg-3" 
         *ngFor="let producto of productos">

      <div class="card shadow-sm h-100 product-card">

        <img *ngIf="producto.imagenNombre"
             [src]="productoService.obtenerUrlImagen(producto.imagenNombre)"
             [alt]="producto.nombre"
             class="card-img-top product-img"
             (error)="onImageError($event)"
             loading="lazy"/>

        <div *ngIf="!producto.imagenNombre"
             class="card-img-top product-img placeholder d-flex justify-content-center align-items-center">
          <i class="bi bi-image text-white placeholder-icon"></i>
        </div>

        <div class="card-body d-flex flex-column">
          
          <h5 class="card-title fw-semibold text-truncate">
            <i class="bi bi-box-seam me-1"></i>{{ producto.nombre }}
          </h5>

          <p class="card-text descripcion">
            {{ producto.descripcion }}
          </p>

          <p class="precio">
            <i class="bi bi-cash-coin me-1"></i>
            S/ {{ producto.precio | number:'1.2-2' }}
          </p>

          <span class="badge estado-badge mb-2"
                [ngClass]="producto.disponibilidad === 'Disponible' ? 'bg-success' : 'bg-danger'">
            <i class="bi bi-dot"></i>{{ producto.disponibilidad }}
          </span>

          <div class="cantidad-wrapper d-flex align-items-center gap-2 mt-2">
            <input type="number"
                   class="form-control cantidad-input"
                   min="1"
                   [max]="producto.stock"
                   [(ngModel)]="cantidades[producto.id]">

            <small class="text-muted d-flex align-items-center gap-1">
              <i class="bi bi-box"></i>
              Stock: {{ producto.stock }}
            </small>
          </div>

          <div class="mt-auto d-grid">
            <button class="btn btn-primary d-flex justify-content-center align-items-center gap-2"
                    (click)="agregar(producto)"
                    [disabled]="producto.disponibilidad !== 'Disponible'">
              <i class="bi bi-cart-plus"></i>
              Agregar al carrito
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!cargando && productos.length === 0" 
       class="text-center py-5 productos-empty">
    <i class="bi bi-inbox empty-icon"></i>
    <p class="text-muted mt-3">No hay productos disponibles en este momento</p>
  </div>

</div>

<app-footer></app-footer>
