<div class="metodos-container">
  <p-toast></p-toast>

  <!-- Header -->
  <div class="header-section">
    <h2>Gestión de Métodos de Pago</h2>
    <button 
      pButton 
      label="Agregar Método de Pago" 
      icon="pi pi-plus" 
      class="p-button-success"
      (click)="mostrarDialogo()"
    ></button>
  </div>

  <!-- Tabla de Métodos -->
  <p-table 
    [value]="metodos" 
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5,10,20]"
    [sortMode]="'multiple'"
    [responsiveLayout]="'scroll'"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
        <th style="width: 12rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-m>
      <tr>
        <td>{{ m.id }}</td>
        <td>{{ m.nombre }}</td>
        <td>
          <div class="flex justify-content-center gap-2">
            <button 
              pButton 
              icon="pi pi-pencil" 
              class="p-button-rounded p-button-warning p-button-sm"
              pTooltip="Editar"
              tooltipPosition="top"
              (click)="editarMetodo(m)"
            ></button>
            <button 
              pButton 
              icon="pi pi-trash" 
              class="p-button-rounded p-button-danger p-button-sm"
              pTooltip="Eliminar"
              tooltipPosition="top"
              (click)="eliminarMetodo(m.id!)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center">No hay métodos de pago registrados</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Diálogo Crear/Editar -->
  <p-dialog 
    [(visible)]="mostrarFormulario" 
    [header]="editando ? 'Editar Método de Pago' : 'Agregar Método de Pago'"
    [modal]="true"
    [style]="{width: '450px'}"
    [draggable]="false"
    [resizable]="false"
    [closable]="false"
  >
    <form [formGroup]="form" (ngSubmit)="guardarMetodo()">
      <div class="field mb-4">
        <label for="nombre" class="label font-semibold mb-2 block">Nombre del método</label>
        <input 
          id="nombre"
          type="text"
          pInputText
          formControlName="nombre"
          placeholder="Ej. Tarjeta, Yape, Transferencia"
          class="w-full"
          [ngClass]="{'ng-invalid': form.get('nombre')?.invalid && form.get('nombre')?.touched}"
        />
        <small *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="p-error">
          El nombre es obligatorio y debe tener al menos 3 caracteres.
        </small>
      </div>

      <div class="dialog-footer flex justify-content-end gap-2 mt-4">
        <button 
          pButton 
          type="button" 
          label="Cancelar" 
          class="p-button-text"
          (click)="cancelar()"
        ></button>
        <button 
          pButton 
          type="submit" 
          [label]="editando ? 'Actualizar' : 'Guardar'" 
          icon="pi pi-check"
          [disabled]="form.invalid || guardando"
        ></button>
      </div>
    </form>
  </p-dialog>

  <!-- Confirmación Eliminación -->
  <p-confirmDialog></p-confirmDialog>
</div>
