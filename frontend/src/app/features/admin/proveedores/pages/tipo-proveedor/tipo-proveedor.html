<div class="tipo-proveedor-container">
  <p-toast></p-toast>

  <div class="header-section">
    <h2>Gestión de Tipos de Proveedor</h2>
    <button 
      pButton 
      label="Nuevo Tipo" 
      icon="pi pi-plus" 
      class="p-button-success"
      (click)="mostrarDialogo()"
    ></button>
  </div>

  <p-table 
    [value]="tipos" 
    [loading]="cargando"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} tipos"
    [rowsPerPageOptions]="[5,10,20]"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
        <th style="width: 12rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.nombre }}</td>
        <td>
          <div class="action-buttons">
            <button 
              pButton 
              icon="pi pi-pencil" 
              class="p-button-rounded p-button-warning p-button-sm"
              (click)="editarRegistro(item)"
            ></button>

            <button 
              pButton 
              icon="pi pi-trash" 
              class="p-button-rounded p-button-danger p-button-sm"
              (click)="confirmarEliminar(item)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="text-center">No hay tipos registrados</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog 
    [(visible)]="mostrarFormulario" 
    [header]="editando ? 'Editar Tipo' : 'Nuevo Tipo'"
    [modal]="true"
    [style]="{width: '450px'}"
    [draggable]="false"
    [resizable]="false"
  >
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="field">
        <label for="nombre" class="label">Nombre del Tipo</label>
        <input 
          id="nombre"
          type="text"
          pInputText
          formControlName="nombre"
          placeholder="Ej. Distribuidor, Mayorista"
          class="w-full"
        />

        <small *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="p-error">
          El nombre es obligatorio (mínimo 3 caracteres).
        </small>
      </div>

      <div class="dialog-footer">
        <button 
          pButton 
          type="button" 
          label="Cancelar" 
          icon="pi pi-times"
          class="p-button-text"
          (click)="cancelar()"
        ></button>

        <button 
          pButton 
          type="submit"
          [label]="editando ? 'Actualizar' : 'Guardar'"
          icon="pi pi-check"
          [loading]="guardando"
          [disabled]="form.invalid || guardando"
        ></button>
      </div>
    </form>
  </p-dialog>

  <p-confirmDialog></p-confirmDialog>
</div>
