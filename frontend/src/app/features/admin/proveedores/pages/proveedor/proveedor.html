<div class="proveedores-container">
  <p-toast></p-toast>

  <!-- Header -->
  <div class="header-section flex justify-content-between align-items-center mb-3">
    <h2>Gestión de Proveedores</h2>
    <button
      pButton
      label="Nuevo Proveedor"
      icon="pi pi-plus"
      class="p-button-success"
      (click)="abrirNuevo()"
    ></button>
  </div>

  <!-- Tabla de Proveedores -->
  <p-table
    [value]="proveedores"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} proveedores"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
        <th pSortableColumn="telefono">Teléfono <p-sortIcon field="telefono"></p-sortIcon></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
        <th pSortableColumn="direccion">Dirección <p-sortIcon field="direccion"></p-sortIcon></th>
        <th pSortableColumn="tipoProveedor">Tipo <p-sortIcon field="tipoProveedor"></p-sortIcon></th>
        <th style="width: 12rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-prov>
      <tr>
        <td>{{ prov.id }}</td>
        <td>{{ prov.nombre }}</td>
        <td>{{ prov.telefono }}</td>
        <td>{{ prov.email }}</td>
        <td>{{ prov.direccion }}</td>
        <td>{{ prov.tipoProveedor }}</td>
        <td>
          <div class="action-buttons flex gap-2 justify-content-center">
            <button
              pButton
              icon="pi pi-pencil"
              class="p-button-rounded p-button-warning p-button-sm"
              pTooltip="Editar"
              tooltipPosition="top"
              (click)="editarProveedor(prov)"
            ></button>
            <button
              pButton
              icon="pi pi-trash"
              class="p-button-rounded p-button-danger p-button-sm"
              pTooltip="Eliminar"
              tooltipPosition="top"
              (click)="confirmarEliminar(prov.id)"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center">No hay proveedores registrados</td>
      </tr>
    </ng-template>
  </p-table>

  <!-- Diálogo Crear/Editar Proveedor -->
  <p-dialog
    [(visible)]="proveedorDialog"
    [header]="proveedorForm.id === 0 ? 'Nuevo Proveedor' : 'Editar Proveedor'"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
    [resizable]="false"
  >
    <form>
      <div class="p-fluid">

        <div class="field">
          <label>Nombre</label>
          <input type="text" pInputText [(ngModel)]="proveedorForm.nombre" name="nombre"/>
        </div>

        <div class="field">
          <label>Teléfono</label>
          <input type="number" pInputText [(ngModel)]="proveedorForm.telefono" name="telefono"/>
        </div>

        <div class="field">
          <label>Email</label>
          <input type="text" pInputText [(ngModel)]="proveedorForm.email" name="email"/>
        </div>

        <div class="field">
          <label>Dirección</label>
          <input type="text" pInputText [(ngModel)]="proveedorForm.direccion" name="direccion"/>
        </div>

        <!-- Select nativo para Tipo de Proveedor -->
        <div class="field">
          <label>Tipo Proveedor</label>
          <select [(ngModel)]="proveedorForm.tipoProveedorId" name="tipoProveedorId" class="p-inputtext p-d-block w-full">
            <option value="0" disabled>Seleccionar</option>
            <option *ngFor="let tipo of tipos" [value]="tipo.id">{{ tipo.nombre }}</option>
          </select>
        </div>

      </div>

      <div class="dialog-footer flex justify-content-end gap-2 mt-3">
        <button pButton label="Cancelar" class="p-button-text" type="button" (click)="proveedorDialog = false"></button>
        <button pButton label="Guardar" type="button" (click)="guardarProveedor()"></button>
      </div>
    </form>
  </p-dialog>

  <!-- Confirmación de Eliminación -->
  <p-confirmDialog></p-confirmDialog>
</div>
