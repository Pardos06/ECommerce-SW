<div class="dashboard-container">
  <!-- Header compartido -->
  <app-header></app-header>

  <!-- Contenedor del dashboard con sidebar -->
  <div class="dashboard-content">
    <button
      pButton
      icon="pi pi-bars"
      class="p-button-text p-button-rounded menu-toggle"
      (click)="toggleSidebar()"
      title="Alternar menú"
    ></button>

  
  <aside class="sidebar" [class.hidden]="!sidebarVisible">
    <p-panelMenu [model]="menuItems" [style.width]="'100%'"></p-panelMenu>
  </aside>


    <main class="content" [class.expanded]="!sidebarVisible">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
