<div class="dashboard-container">
  <!-- Header compartido -->
  <app-header></app-header>

  <!-- Contenedor del dashboard con sidebar -->
  <div class="dashboard-content">
    <!-- Botón Toggle Sidebar -->
    <button
      pButton
      icon="pi pi-bars"
      class="p-button-text p-button-rounded menu-toggle"
      [class.mobile-toggle]="isMobile || isTablet"
      (click)="toggleSidebar()"
      [title]="sidebarVisible ? 'Ocultar menú' : 'Mostrar menú'"
    ></button>

    <!-- Overlay/Backdrop para móviles y tablets -->
    <div 
      class="sidebar-overlay" 
      [class.active]="sidebarVisible && (isMobile || isTablet)"
      (click)="closeSidebar()"
    ></div>

    <!-- Sidebar -->
    <aside 
      class="sidebar" 
      [class.visible]="sidebarVisible"
      [class.mobile]="isMobile"
      [class.tablet]="isTablet"
    >
      <div class="sidebar-header">
        <h3>Menú</h3>
        <button
          *ngIf="isMobile || isTablet"
          pButton
          icon="pi pi-times"
          class="p-button-text p-button-rounded close-sidebar"
          (click)="closeSidebar()"
          title="Cerrar menú"
        ></button>
      </div>
      <p-panelMenu [model]="menuItems" [style.width]="'100%'"></p-panelMenu>
    </aside>

    <!-- Contenido Principal -->
    <main class="content" [class.expanded]="!sidebarVisible" [class.mobile]="isMobile">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
