<div class="areas-container">
  <p-toast></p-toast>

  <div class="header-section">
    <h2>Gestión de Áreas</h2>

    <button 
      pButton 
      label="Nueva Área" 
      icon="pi pi-plus" 
      class="p-button-success"
      (click)="mostrarDialogo()"
    ></button>
  </div>

  <p-table 
    [value]="areas" 
    [loading]="cargando"
    [paginator]="true"
    [rows]="10"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} áreas"
    [rowsPerPageOptions]="[5,10,20]"
    styleClass="p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre"></p-sortIcon></th>
        <th pSortableColumn="descripcion">Descripción <p-sortIcon field="descripcion"></p-sortIcon></th>
        <th style="width: 10rem">Acciones</th>
      </tr>
    </ng-template>
    
    <ng-template pTemplate="body" let-area>
      <tr>
        <td>{{ area.id }}</td>
        <td>{{ area.nombre }}</td>
        <td>{{ area.descripcion }}</td>
        <td>
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-warning p-button-sm" (click)="editarArea(area)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-sm" (click)="confirmarEliminar(area)"></button>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center">No hay áreas registradas</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog 
    [(visible)]="mostrarFormulario" 
    [header]="editando ? 'Editar Área' : 'Nueva Área'"
    [modal]="true"
    [style]="{width: '450px'}"
    [draggable]="false"
    [resizable]="false"
  >
    <form [formGroup]="form" (ngSubmit)="guardarArea()">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" pInputText formControlName="nombre" />
      </div>

      <div class="field">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" pInputTextarea formControlName="descripcion"></textarea>
      </div>

      <div class="dialog-footer">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="cancelar()"></button>
        <button pButton type="submit" [label]="editando ? 'Actualizar' : 'Guardar'" icon="pi pi-check" [loading]="guardando"></button>
      </div>
    </form>
  </p-dialog>

  <p-confirmDialog></p-confirmDialog>
</div>
